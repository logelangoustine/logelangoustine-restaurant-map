<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loge Langoustine</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#111;
    color:white;
}

.header{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    z-index:1000;

    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(10px);

    padding:12px;
    border-radius:12px;

    text-align:center;
}

.header h1{
    font-size:22px;
}

.header p{
    font-size:13px;
    color:#ccc;
    margin-top:4px;
}

#map{
    height:100vh;
    width:100%;
}

.leaflet-popup-content{
    font-size:15px;
}
</style>
</head>

<body>

<div class="header">
    <h1>🦞 Loge Langoustine</h1>
    <p>Restaurantkort</p>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([41.3851, 2.1734], 8);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom:19,
        attribution:'© OpenStreetMap'
    }
).addTo(map);


// ENIGMA
L.marker([41.3785,2.1548]).addTo(map)
.bindPopup(`
<b>Enigma</b><br>
Barcelona, Spanien<br><br>
🍾 Loge Langoustine
`);


// HERMANOS TORRES
L.marker([41.3920,2.1455]).addTo(map)
.bindPopup(`
<b>Cocina Hermanos Torres</b><br>
Barcelona, Spanien<br><br>
🍾 Loge Langoustine
`);


// HOFFMAN
L.marker([41.3859,2.1815]).addTo(map)
.bindPopup(`
<b>Hoffman</b><br>
Barcelona, Spanien<br><br>
🍾 Loge Langoustine
`);


// MIRAMAR
L.marker([42.3653,3.1607]).addTo(map)
.bindPopup(`
<b>Miramar</b><br>
Llançà, Girona<br><br>
🍾 Loge Langoustine
`);

</script>

</body>
</html>
