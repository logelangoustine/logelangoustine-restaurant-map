<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loge Langoustine</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

#container{
    display:flex;
    min-height:100vh;
}

#sidebar{
    width:350px;
    background:#1a1a1a;
    padding:20px;
    overflow-y:auto;
    border-right:1px solid #333;
}

#content{
    flex:1;
    padding:40px;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:50%;
}

.language-switch{
    text-align:center;
    margin-bottom:20px;
}

.language-switch button{
    background:#222;
    color:white;
    border:1px solid #444;
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
    margin:2px;
}

.language-switch button:hover{
    background:#333;
}

.toggle{
    width:100%;
    background:none;
    border:none;
    color:white;
    text-align:left;
    font-size:18px;
    cursor:pointer;
    padding:8px 0;
}

.city{
    margin-left:40px;
    padding:2px 0;
    font-size:15px;
    color:#cfcfcf;
}

.restaurant{
    margin-left:40px;
    color:#7cc8ff;
    cursor:pointer;
    padding:5px 0;
}

.restaurant:hover{
    color:white;
}

.hidden{
    display:none;
}

h1{
    margin-top:0;
}

.info-card{
    background:#222;
    padding:20px;
    border-radius:12px;
    max-width:800px;
}

.info-card a{
    color:#7cc8ff;
}

@media(max-width:900px){

    #container{
        flex-direction:column;
    }

    #sidebar{
        width:100%;
    }

    #content{
        padding:20px;
    }
}

</style>
</head>
<body>

<div id="container">

    <div id="sidebar">

        <div class="logo">
            <img src="images/logo.png">
        </div>

        <div class="language-switch">
            <button onclick="setLanguage('da')">DA</button>
            <button onclick="setLanguage('en')">EN</button>
        </div>

        <div id="menu">
            Indlæser restauranter...
        </div>

    </div>

    <div id="content">

        <h1>Velkommen til Loge Langoustine</h1>

        <div class="info-card">

            <p>
                Velkommen til vores gastronomiske univers.
            </p>

            <p>
                På denne side samler vi restauranter,
                vinbarer og madoplevelser fra Danmark
                og resten af verden.
            </p>

            <p>
                Vælg et land i menuen til venstre.
            </p>

        </div>

    </div>

</div>

<script>

let restaurants = [];
let currentLanguage = "da";

fetch('GithubRestauranter.csv')
.then(response => response.text())
.then(csv => {

    const rows = csv.trim().split('\n').slice(1);

    restaurants = rows.map(row => {

        const cols = row.split(';');

        return {
            land: (cols[0] || "").trim(),
            by: (cols[1] || "").trim(),
            restaurant: (cols[2] || "").trim(),
            michelin: (cols[3] || "").trim(),
            adresse: (cols[4] || "").trim(),
            instagram: (cols[5] || "").trim(),
            anmeldelse: (cols[6] || "").trim(),
            billede: (cols[7] || "").trim()
        };

    });

    buildMenu();

});

function buildMenu(){

    const menu = document.getElementById('menu');

    let html = '';

    const lande = [...new Set(
        restaurants.map(r => r.land)
    )];

    lande.forEach((land,landIndex)=>{

       html += `
<div style="
    display:flex;
    align-items:center;
">

    <span
        style="
            cursor:pointer;
            width:20px;
            display:inline-block;
        "
        onclick="toggleMenu('land${landIndex}', this)">
        ▶
    </span>

    <span
        style="
            cursor:pointer;
            padding-left:8px;
            font-size:18px;
        "
        onclick="showCountry('${land}')">
        ${land}
    </span>

</div>

<div id="land${landIndex}" class="hidden">
`;

        const byer = [...new Set(

            restaurants
            .filter(r => r.land === land)
            .map(r => r.by)

        )];

        byer.forEach((by,byIndex)=>{

            html += `
            <button class="toggle city"
onclick="showCity('${by}')">
    ${by}
</button>

            <div id="by${landIndex}${byIndex}"
                 class="hidden">
            `;

            restaurants
            .filter(r => r.land === land && r.by === by)
            .forEach(r => {

                html += `
                <div class="restaurant"
                     onclick="showRestaurant('${r.restaurant}')">
                    ${r.restaurant}
                </div>
                `;

            });

            html += `</div>`;

        });

        html += `</div>`;

    });

    menu.innerHTML = html;

}

function toggleMenu(id,btn){

    const element =
        document.getElementById(id);

    if(element.style.display==="block"){

        element.style.display="none";
        btn.innerHTML =
            btn.innerHTML.replace("▼","▶");

    }else{

        element.style.display="block";
        btn.innerHTML =
            btn.innerHTML.replace("▶","▼");

    }

}

function setLanguage(lang){

    currentLanguage = lang;

    if(lang === "da"){

        document.getElementById('content').innerHTML = `

        <h1>Velkommen til Loge Langoustine</h1>

        <div class="info-card">

            <p>
                Velkommen til vores gastronomiske univers.
            </p>

            <p>
                På denne side samler vi restauranter,
                vinbarer og madoplevelser fra Danmark
                og resten af verden.
            </p>

            <p>
                Vælg et land i menuen til venstre.
            </p>

        </div>
        `;

    }else{

        document.getElementById('content').innerHTML = `

        <h1>Welcome to Loge Langoustine</h1>

        <div class="info-card">

            <p>
                Welcome to our gastronomic universe.
            </p>

            <p>
                Here we collect restaurants,
                wine bars and dining experiences
                from Denmark and around the world.
            </p>

            <p>
                Choose a country in the menu.
            </p>

        </div>
        `;

    }

}

function showCountry(country){

    const countryRestaurants =
        restaurants.filter(r => r.land === country);

    let html = `
        <h1>${country}</h1>

        <div class="info-card">
            <p>
                ${countryRestaurants.length} steder
            </p>
        </div>

        <br>
    `;

    countryRestaurants.forEach(r => {

        html += `

        <div class="info-card"
             style="
                margin-bottom:20px;
                cursor:pointer;
             "
             onclick="showRestaurant('${r.restaurant}')">

            ${r.billede ? `
            <img
                src="${r.billede}"
                style="
                    width:100%;
                    max-height:250px;
                    object-fit:cover;
                    border-radius:12px;
                    margin-bottom:15px;
                ">
            ` : ''}

            <h2>${r.restaurant}</h2>

            ${r.michelin ? `
            <div style="
                font-size:24px;
                margin-bottom:10px;
            ">
                ${"⭐".repeat(parseInt(r.michelin))}
            </div>
            ` : ''}

        </div>

        `;

    });

    document.getElementById('content').innerHTML = html;
}
    
    function showCity(city){

    const cityRestaurants =
        restaurants.filter(r => r.by === city);

    let html = `
        <h1>${city}</h1>

        <div class="info-card">
            <p>
                ${cityRestaurants.length} steder
            </p>
        </div>

        <br>
    `;

    cityRestaurants.forEach(r => {

        html += `

        <div class="info-card"
             style="
                margin-bottom:20px;
                cursor:pointer;
             "
             onclick="showRestaurant('${r.restaurant}')">

            ${r.billede ? `
            <img
                src="${r.billede}"
                style="
                    width:100%;
                    max-height:250px;
                    object-fit:cover;
                    border-radius:12px;
                    margin-bottom:15px;
                ">
            ` : ''}

            <h2>${r.restaurant}</h2>

            ${r.michelin ? `
            <div style="font-size:24px;">
                ${"⭐".repeat(parseInt(r.michelin))}
            </div>
            ` : ''}

        </div>

        `;
    });

    document.getElementById('content').innerHTML = html;
}
    
function showRestaurant(name){

    const r =
    restaurants.find(x =>
        x.restaurant === name);

    const addressLabel =
        currentLanguage === "da"
        ? "📍 Adresse"
        : "📍 Address";

    const reviewLabel =
        currentLanguage === "da"
        ? "💬 Anmeldelse"
        : "💬 Review";

    const reviewText =
        currentLanguage === "da"
        ? (r.anmeldelse || "Ingen anmeldelse endnu")
        : (r.anmeldelse || "No review yet");

    const reelText =
        currentLanguage === "da"
        ? "🎥 Se Instagram Reel"
        : "🎥 Watch Instagram Reel";

    document.getElementById('content').innerHTML = `

        <h1>${r.restaurant}</h1>

        <div class="info-card">

    ${r.billede ? `
    <img
        src="${r.billede}"
        style="
            width:100%;
            max-height:450px;
            object-fit:cover;
            border-radius:12px;
            margin-bottom:20px;
        ">
    ` : ''}

            ${r.michelin ? `
<div style="
    font-size:34px;
    margin-bottom:20px;
">
    ${"⭐".repeat(parseInt(r.michelin))}
</div>
` : ''}

            <p>
                <strong>${addressLabel}</strong><br>
                ${r.adresse}
            </p>

            <p>
                <strong>${reviewLabel}</strong><br>
                ${reviewText}
            </p>

            ${r.instagram ? `
<p>
    <a href="${r.instagram}"
       target="_blank">
       ${reelText}
    </a>
</p>
` : ''}

        </div>

    `;

}

</script>

</body>
</html>
