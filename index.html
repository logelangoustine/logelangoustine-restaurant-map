<script>

let restaurants = [];
let currentLanguage = "da";
let currentPage = {
    type: "home"
};
let reviewTeaserSlideshowTimer = null;

const reviewTeaserSlideshowImages = {
    "Gastromé": "images/gastrome/1.jpg",
    "Lyst": "images/lyst/1.jpg"
};

let previousPage = null;
let previousScrollY = 0;

let mapMode = false;

    let activeCategories = {

};

function t(da, en){
    return currentLanguage === "da" ? da : en;
}

function updateMobileMenuButton(){

    const button = document.querySelector(".mobile-menu-toggle");
    if(!button) return;

    const isOpen =
        document.getElementById("sidebar").classList.contains("mobile-menu-open");
    button.setAttribute("aria-expanded", String(isOpen));
    button.setAttribute(
        "aria-label",
        isOpen ? t("Luk menu", "Close menu") : t("Åbn menu", "Open menu")
    );
    button.querySelector(".mobile-menu-label").textContent =
        isOpen ? t("Luk", "Close") : t("Menu", "Menu");
}

function toggleMobileMenu(){

    document.getElementById("sidebar")
        .classList.toggle("mobile-menu-open");
    updateMobileMenuButton();
}

function closeMobileMenu(){

    document.getElementById("sidebar")
        .classList.remove("mobile-menu-open");
    updateMobileMenuButton();
}

function escapeHtml(value){
    return value.replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    }[character]));
}

function reviewVisitDate(review){

    const visit = review.match(/\bBesøgt:\s*([^\n]+)/i);
    if(!visit) return 0;

    const months = {
        januar: 0,
        februar: 1,
        marts: 2,
        april: 3,
        maj: 4,
        juni: 5,
        juli: 6,
        august: 7,
        september: 8,
        oktober: 9,
        november: 10,
        december: 11
    };
    const date = visit[1].trim().match(/^([^\s]+)\s+(\d{4})$/);
    if(!date) return 0;

    const month = months[date[1].toLocaleLowerCase("da")];
    if(month === undefined) return 0;

    return new Date(Number(date[2]), month, 1).getTime();
}

function reviewVisitLabel(review){

    const visit = review.match(/\bBesøgt:\s*([^\n]+)/i);
    return visit ? visit[1].trim() : "";
}

function reviewRating(review){

    const rating = review.match(/\bSamlet karakter:\s*([\d.,]+)/i);
    return rating ? rating[1] : "";
}

function reviewTeaserText(review){

    const paragraph = review
        .split(/\n\s*\n/)
        .find(text => text.trim() && !/^\s*Samlet karakter:/i.test(text));
    if(!paragraph) return "";

    const text = paragraph.trim();
    return text.length > 220
        ? `${text.slice(0, 217).trimEnd()}...`
        : text;
}

function reviewedRestaurants(){

    return restaurants
        .filter(restaurant =>
            restaurant.anmeldelse &&
            !/^\s*Anmeldelse kommer snart\s*$/i.test(restaurant.anmeldelse)
        )
        .sort((a, b) =>
            reviewVisitDate(b.anmeldelse) - reviewVisitDate(a.anmeldelse)
        )
        .slice(0, 3);
}

function startReviewTeaserSlideshow(){

    if(reviewTeaserSlideshowTimer !== null){
        clearInterval(reviewTeaserSlideshowTimer);
        reviewTeaserSlideshowTimer = null;
    }

    const slideshows = [
        ...document.querySelectorAll(
            ".review-teaser-image-frame[data-review-slideshow]"
        )
    ];
    if(!slideshows.length) return;

    let showAlternate = false;
    reviewTeaserSlideshowTimer = setInterval(() => {
        if(currentPage.type !== "home"){
            clearInterval(reviewTeaserSlideshowTimer);
            reviewTeaserSlideshowTimer = null;
            return;
        }

        showAlternate = !showAlternate;
        slideshows.forEach(slideshow => {
            slideshow.querySelectorAll(".review-teaser-image")
                .forEach((image, index) => {
                    image.classList.toggle(
                        "is-visible",
                        index === (showAlternate ? 1 : 0)
                    );
                });
        });
    }, 3000);
}

function showHomePage(){

    currentPage = { type: "home" };

    const reviews = reviewedRestaurants();
    const teaserCards = reviews.map(restaurant => {
        const alternateImage =
            reviewTeaserSlideshowImages[restaurant.restaurant];

        return `
        <article class="review-teaser">
            ${restaurant.billede ? `
            <div
                class="review-teaser-image-frame"
                ${alternateImage ? 'data-review-slideshow' : ""}>
                <img
                    class="review-teaser-image is-visible"
                    src="${escapeHtml(restaurant.billede)}"
                    alt="${escapeHtml(restaurant.restaurant)}">
                ${alternateImage ? `
                <img
                    class="review-teaser-image"
                    src="${escapeHtml(alternateImage)}"
                    alt=""
                    aria-hidden="true">
                ` : ""}
            </div>
            ` : ""}
            <div class="review-teaser-content">
                <h2>${escapeHtml(restaurant.restaurant)}</h2>
                <p class="review-teaser-meta">${[
                    reviewRating(restaurant.anmeldelse)
                        ? `${t("Karakter", "Rating")}: ${escapeHtml(reviewRating(restaurant.anmeldelse))}`
                        : "",
                    reviewVisitLabel(restaurant.anmeldelse)
                ].filter(Boolean).join(" · ")}</p>
                <p class="review-teaser-excerpt">${escapeHtml(reviewTeaserText(restaurant.anmeldelse))}</p>
                <button
                    type="button"
                    data-restaurant="${escapeHtml(restaurant.restaurant)}"
                    onclick="showRestaurant(this.dataset.restaurant)">
                    ${t("Læs hele anmeldelsen", "Read the full review")}
                </button>
            </div>
        </article>
    `;
    }).join("");

    document.getElementById("content").innerHTML = `
        <img
            class="home-brand"
            src="images/loge-langoustine.png"
            alt="Loge Langoustine – Rituals of Taste">

        <div class="info-card">
            <p>${t(
                "Velkommen til vores gastronomiske univers.",
                "Welcome to our gastronomic universe."
            )}</p>

            <p>${t(
                "På denne side samler vi restauranter, vinbarer og madoplevelser fra Danmark og resten af verden.",
                "Here we collect restaurants, wine bars and dining experiences from Denmark and around the world."
            )}</p>
        </div>

        ${reviews.length ? `
        <section aria-labelledby="latest-reviews-title">
            <h2 id="latest-reviews-title">${t("Nyeste anmeldelser", "Latest reviews")}</h2>
            <div class="review-teasers">
                ${teaserCards}
            </div>
        </section>
        ` : ""}
    `;

    startReviewTeaserSlideshow();
}

function distanceText(value){

    if(value < 1){
        return Math.round(value * 1000) +
            (currentLanguage === "da"
                ? " m væk"
                : " m away");
    }

    return value.toFixed(1) +
        (currentLanguage === "da"
            ? " km væk"
            : " km away");
}

){

}

if(

){

}

        }

            disposeRouteNavigation();

    },

    error => {

        console.error("Kunne ikke hente din placering:", error);

    }

);


fetch('GithubRestauranter.json')
.then(response => {
    if (!response.ok) {
        throw new Error(`Kunne ikke indlæse restauranter: ${response.status}`);
    }
    return response.json();
})

    if(currentPage.type === "home"){
        showHomePage();

})
.catch(error => {
    console.error("Kunne ikke indlæse restauranter fra JSON:", error);
});

function buildMenu(){

    let html = '';

<label>
<input

Fine Dining

<br>

<label>

<br>

<label>
<input
    type="checkbox"

</label>

<br>

<label>

Kortvisning
</label>

</div>
`;

    const lande = [...new Set(
        restaurants.map(r => r.land)
    )].sort((a, b) => a.localeCompare(b, 'da'));

    lande.forEach((land, landIndex) => {

        html += `
<div style="
    display:flex;
    align-items:center;
">

    <span
        style="
            cursor:pointer;
            width:20px;
            display:inline-block;
        "
        onclick="toggleMenu('land${landIndex}', this)">
        ▶
    </span>

    <span
        class="country-name"
        style="

</div>

<div id="land${landIndex}" class="hidden">
`;

        const regioner = [...new Set(

        regioner.forEach((region, regionIndex) => {

            html += `

">

function setMapMarkers(restaurantList){

    if(!window.mainMap) return [];

    mapMarkers.forEach(marker => marker.remove());
    mapMarkers = [];

    const locations = [];

    restaurantList.forEach(r => {
        if(!r.gps) return;

        const [lat, lng] = r.gps.split(',').map(Number);
        if(!Number.isFinite(lat) || !Number.isFinite(lng)) return;

        locations.push([lat, lng]);
        const marker = L.marker([lat, lng]).addTo(window.mainMap);
        bindRestaurantPopup(marker, r);
        mapMarkers.push(marker);
    });

    return locations;
}

function zoomToRestaurants(restaurantList){

    if(!window.mainMap) return;

    const locations = setMapMarkers(restaurantList);

    if(locations.length === 0) return;

    if(locations.length === 1){
        window.mainMap.flyTo(
            locations[0],
            16,
            {duration:1.2}
        );
        return;
    }

    window.mainMap.flyToBounds(
        L.latLngBounds(locations),
        {
            padding:[50,50],
            maxZoom:16,
            duration:1.2
        }
    );
}

function getDistanceValue(gps){

    if(!gps || !userLat || !userLng)
        return 999999;

    return distanceInKm(gps);
}

function distanceInKm(gps){

    const coords = gps.split(",");

    const lat = parseFloat(coords[0]);
    const lng = parseFloat(coords[1]);

    const dLat =
        (lat - userLat) * Math.PI / 180;

    const dLng =
        (lng - userLng) * Math.PI / 180;

    const latitudeRadians = userLat * Math.PI / 180;
    const destinationLatitudeRadians = lat * Math.PI / 180;

    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2) +

        Math.cos(latitudeRadians) *
        Math.cos(destinationLatitudeRadians) *

        Math.sin(dLng/2) *
        Math.sin(dLng/2);

    const c =
        2 * Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

    return 6371 * c;
}

function distanceBetweenCoordinates(first, second){

    const radians = degrees => degrees * Math.PI / 180;
    const latitudeDelta = radians(second[0] - first[0]);
    const longitudeDelta = radians(second[1] - first[1]);
    const latitude1 = radians(first[0]);
    const latitude2 = radians(second[0]);
    const a =
        Math.sin(latitudeDelta / 2) ** 2 +
        Math.cos(latitude1) * Math.cos(latitude2) *
        Math.sin(longitudeDelta / 2) ** 2;

    const boundedA = Math.min(1, Math.max(0, a));
    return 6371000 * 2 * Math.atan2(Math.sqrt(boundedA), Math.sqrt(1 - boundedA));
}

function findNearestRouteStep(latitude, longitude){

    let nearest = null;
    const point = [latitude, longitude];

    routeSteps.forEach((step, stepIndex) => {
        if(stepIndex < currentRouteStepIndex) return;

        const coordinates = step.geometry.coordinates;
        let distanceAlongStep = 0;
        let geometryLength = 0;

        for(let index = 0; index < coordinates.length - 1; index++){
            const start = [coordinates[index][1], coordinates[index][0]];
            const end = [coordinates[index + 1][1], coordinates[index + 1][0]];
            const segmentLength = distanceBetweenCoordinates(start, end);
            const latitudeScale = 111320;
            const longitudeScale = latitudeScale * Math.cos(latitude * Math.PI / 180);
            const dx = (end[1] - start[1]) * longitudeScale;
            const dy = (end[0] - start[0]) * latitudeScale;
            const px = (longitude - start[1]) * longitudeScale;
            const py = (latitude - start[0]) * latitudeScale;
            const segmentLengthSquared = dx * dx + dy * dy;
            const fraction = segmentLengthSquared === 0
                ? 0
                : Math.max(0, Math.min(1, (px * dx + py * dy) / segmentLengthSquared));
            const offsetX = px - fraction * dx;
            const offsetY = py - fraction * dy;
            const distanceFromSegment = Math.sqrt(offsetX * offsetX + offsetY * offsetY);

            if(!nearest || distanceFromSegment < nearest.distance){
                nearest = {
                    stepIndex,
                    distance: distanceFromSegment,
                    distanceAlongStep: distanceAlongStep + segmentLength * fraction,
                    geometryLength: 0
                };
            }

            distanceAlongStep += segmentLength;
            geometryLength += segmentLength;
        }

        if(nearest && nearest.stepIndex === stepIndex){
            nearest.geometryLength = geometryLength;
        }
    });

    return nearest;
}

function updateNavigation(position){

    if(!routeMap || !routeSteps.length) return;

    userLat = position.coords.latitude;
    userLng = position.coords.longitude;

    const location = [userLat, userLng];
    if(!routeLocationMarker){
        routeLocationMarker = L.marker(location, {
            icon: L.divIcon({
                className: "",
                html: '<div style="width:22px;height:30px;clip-path:polygon(50% 0,100% 100%,50% 80%,0 100%);background:linear-gradient(90deg,#0755a8 0%,#69b8ff 48%,#0870de 100%);filter:drop-shadow(0 2px 3px #111);"></div>',
                iconSize: [22, 30],
                iconAnchor: [11, 15]
            }),
            zIndexOffset: 1000
        }).addTo(routeMap);
        if(routePreviewMarker){
            routePreviewMarker.remove();
            routePreviewMarker = null;
        }
    }else{
        routeLocationMarker.setLatLng(location);
    }

    if(Number.isFinite(position.coords.heading)){
        const arrow = routeLocationMarker.getElement();
        const arrowShape = arrow && arrow.firstElementChild;
        if(arrowShape){
            arrowShape.style.transform = `rotate(${position.coords.heading}deg)`;
        }
    }

    if(!routeLocationHalo){

            weight: 2,
            fillColor: "#1687ff",
            fillOpacity: 0.2
        }).addTo(routeMap);
    }else{
        routeLocationHalo.setLatLng(location);
    }

    const speedKmh = Number.isFinite(position.coords.speed)
        ? position.coords.speed * 3.6
        : 0;
    const navigationZoom = speedKmh <= 10 ? 17 : 15.5;
    const forwardOffset = routeMap.getSize().y * 0.18;
    const projectedLocation = routeMap.project(location, navigationZoom);
    const navigationCenter = routeMap.unproject(
        projectedLocation.subtract([0, forwardOffset]),
        navigationZoom
    );
    routeMap.setView(navigationCenter, navigationZoom, { animate: true });

    const nearest = findNearestRouteStep(userLat, userLng);
    if(!nearest) return;

    currentRouteStepIndex = Math.max(currentRouteStepIndex, nearest.stepIndex);

    const currentStep = routeSteps[currentRouteStepIndex];
    const nextStep = routeSteps[currentRouteStepIndex + 1];
    const geometryProgress = nearest.geometryLength
        ? nearest.distanceAlongStep / nearest.geometryLength
        : 0;
    const currentStepRemaining = Math.max(
        0,
        currentStep.distance * (1 - geometryProgress)
    );
    const remainingDistance = routeSteps
        .slice(currentRouteStepIndex + 1)
        .reduce((total, step) => total + step.distance, currentStepRemaining);
    const remainingDuration = routeSteps
        .slice(currentRouteStepIndex + 1)
        .reduce((total, step) => total + step.duration, currentStep.duration * (1 - geometryProgress));
    const maneuverStep = nextStep || currentStep;
    const distanceToManeuver = nextStep
        ? (nextStep.maneuver.type === "arrive"
            ? remainingDistance
            : currentStepRemaining)
        : 0;
    const instruction = document.getElementById("route-instruction");
    const distance = document.getElementById("route-distance");
    const status = document.getElementById("route-status");
    const arrivalTime = document.getElementById("route-arrival-time");
    const maneuverIcon = document.getElementById("route-maneuver-icon");
    const maneuver = maneuverStep.maneuver || {};
    const maneuverArrow = maneuver.type === "arrive"
        ? "◎"
        : maneuver.type === "roundabout" || maneuver.type === "rotary"
            ? "↻"
            : maneuver.modifier && maneuver.modifier.includes("left")
                ? "↰"
                : maneuver.modifier && maneuver.modifier.includes("right")
                    ? "↱"
                    : maneuver.modifier === "uturn"
                        ? "↶"
                        : "↑";

    if(instruction){
        instruction.textContent = routeManeuverText(maneuverStep);
    }
    if(maneuverIcon){
        maneuverIcon.textContent = maneuverArrow;
    }
    if(distance){
        distance.textContent = routeDistanceText(distanceToManeuver);
    }
    if(status){
        const arrival = new Date(Date.now() + remainingDuration * 1000);
        const arrivalClock = arrival.toLocaleTimeString(
            currentLanguage === "da" ? "da-DK" : "en-GB",
            { hour: "2-digit", minute: "2-digit" }
        );
        status.textContent = t(
            `${routeDistanceText(remainingDistance)} · ankomst ca. ${arrivalClock}`,
            `${routeDistanceText(remainingDistance)} · arrival about ${arrivalClock}`
        );
    }
    if(arrivalTime){
        arrivalTime.textContent = t(
            `Cirka ${routeDurationText(remainingDuration)}`,
            `About ${routeDurationText(remainingDuration)}`
        );
    }
}

function stopNavigation(){

    if(routeWatchId !== null){
        navigator.geolocation.clearWatch(routeWatchId);
        routeWatchId = null;
    }

    routeNavigationStarted = false;

    const mapViewport = document.getElementById("route-map-viewport");
    const startButton = document.getElementById("route-start-button");
    const pauseControl = document.getElementById("route-guidance-control");
    const instruction = document.getElementById("route-instruction");
    const status = document.getElementById("route-status");

    if(mapViewport){
        mapViewport.classList.remove("route-guidance-active");
    }
    if(startButton){
        startButton.style.display = "inline-block";
        startButton.disabled = false;
        startButton.textContent = t("Start rutevejledning", "Start navigation");
    }
    if(pauseControl){
        pauseControl.style.display = "none";
    }
    if(routeMap && routeOverviewBounds){
        routeMap.fitBounds(routeOverviewBounds, {
            paddingTopLeft: [24, 120],
            paddingBottomRight: [24, 120],
            maxZoom: 16,
            animate: true
        });
    }
    const distance = document.getElementById("route-distance");
    if(instruction){
        instruction.textContent = t("Ruteoversigt", "Route overview");
    }
    if(distance && routeTotalDistance){
        distance.textContent = routeDistanceText(routeTotalDistance);
    }
    const maneuverIcon = document.getElementById("route-maneuver-icon");
    if(maneuverIcon){
        maneuverIcon.textContent = "↗";
    }
    if(status){
        const arrival = new Date(Date.now() + routeTotalDuration * 1000);
        const arrivalClock = arrival.toLocaleTimeString(
            currentLanguage === "da" ? "da-DK" : "en-GB",
            { hour: "2-digit", minute: "2-digit" }
        );
        status.textContent = t(
            `${routeDistanceText(routeTotalDistance)} · ankomst ca. ${arrivalClock}`,
            `${routeDistanceText(routeTotalDistance)} · arrival about ${arrivalClock}`
        );
    }
    setRouteMode(routeTravelMode);

    const carButton = document.getElementById("route-mode-car");
    const walkButton = document.getElementById("route-mode-walk");
    if(carButton) carButton.disabled = false;
    if(walkButton) walkButton.disabled = false;
}

function startRouteGuidance(){

    const startButton = document.getElementById("route-start-button");
    const mapViewport = document.getElementById("route-map-viewport");
    const status = document.getElementById("route-status");

    if(!startButton || !mapViewport || !routeMap || !routeSteps.length) return;

    if(!navigator.geolocation){
        if(status){
            status.textContent = t(
                "Din browser understøtter ikke placering.",
                "Your browser does not support location access."
            );
        }
        return;
    }

    const requestId = routeRequestId;
    startButton.disabled = true;
    startButton.textContent = t("Finder din placering...", "Finding your location...");

    navigator.geolocation.getCurrentPosition(
        position => {
            if(requestId !== routeRequestId || !document.getElementById("route-modal")) return;

            routeNavigationStarted = true;
            mapViewport.classList.add("route-guidance-active");
            startButton.style.display = "none";
            const carButton = document.getElementById("route-mode-car");
            const walkButton = document.getElementById("route-mode-walk");
            if(carButton) carButton.disabled = true;
            if(walkButton) walkButton.disabled = true;

            const pauseControl = document.getElementById("route-guidance-control");
            if(pauseControl){
                pauseControl.style.display = "block";
            }

            updateNavigation(position);
            routeWatchId = navigator.geolocation.watchPosition(
                nextPosition => {
                    if(requestId === routeRequestId && routeNavigationStarted){
                        updateNavigation(nextPosition);
                    }
                },
                error => {
                    console.error("GPS-navigationen mistede placeringen:", error);
                    if(requestId === routeRequestId){
                        const routeStatus = document.getElementById("route-status");
                        if(routeStatus){
                            routeStatus.textContent = t(
                                "Live placering mistet. Kontrollér GPS-tilladelse og signal.",
                                "Live location lost. Check location permission and GPS signal."
                            );
                        }
                        routeWatchId = null;
                    }
                },
                { enableHighAccuracy: true, maximumAge: 3000, timeout: 15000 }
            );
        },
        error => {
            console.error("Kunne ikke hente din placering til rutevejledningen:", error);
            if(requestId !== routeRequestId) return;

            startButton.disabled = false;
            startButton.textContent = t("Start rutevejledning", "Start navigation");
            if(status){
                status.textContent = t(
                    "Din placering kunne ikke hentes. Tillad placering i browseren, og prøv igen.",
                    "Your location could not be retrieved. Allow location access in your browser and try again."
                );
            }
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
    );
}

function disposeRouteNavigation(){

    if(routeWatchId !== null && navigator.geolocation){
        navigator.geolocation.clearWatch(routeWatchId);
        routeWatchId = null;
    }

    routeRequestId++;
    routeLoadId++;
    routeModeChangeHandler = null;
    routeNavigationStarted = false;
    routeSteps = [];
    routeLocationMarker = null;
    routeLocationHalo = null;
    routePreviewMarker = null;
    routeOverviewBounds = null;
    routeTotalDistance = 0;
    routeTotalDuration = 0;

    if(routeMap){
        routeMap.stop();
        routeMap.remove();
        routeMap = null;
    }
}

function closeRouteModal(){

    if(routeTriggerButton && routeTriggerButton.isConnected){
        routeTriggerButton.disabled = false;
    }
    routeTriggerButton = null;

    const modal = document.getElementById("route-modal");
    if(modal){
        modal.remove();
    }

    document.body.style.overflow = "";
}

        if(requestId !== routeRequestId) return;
        const status = document.getElementById("route-status");
        if(status){
            status.textContent = message;
        }
        routeButton.disabled = false;
    };

    const loadRoute = (originLat, originLng) => {
        if(requestId !== routeRequestId) return;
        if(!document.getElementById("route-map-canvas")) return;

        const loadId = ++routeLoadId;
        const mode = routeTravelMode;
        const status = document.getElementById("route-status");
        const startButton = document.getElementById("route-start-button");

        if(status){
            status.textContent = mode === "car"
                ? t("Henter bilrute...", "Loading driving route...")
                : t("Henter gå-rute...", "Loading walking route...");
        }
        if(startButton){
            startButton.disabled = true;
        }

        const origin = [originLat, originLng];
        const destination = [destinationLat, destinationLng];

        const routingProfile = mode === "car" ? "routed-car" : "routed-foot";
        const profile = mode === "car" ? "driving" : "foot";
        const routeUrl =
            `https://routing.openstreetmap.de/${routingProfile}/route/v1/${profile}/${originLng},${originLat};${destinationLng},${destinationLat}?overview=full&steps=true&geometries=geojson&alternatives=true`;

        fetch(routeUrl)
            .then(response => {
                if(!response.ok){
                    throw new Error(`Routing service returned ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if(data.code !== "Ok" || !data.routes || !data.routes.length){
                    throw new Error(data.message || "No route found");
                }

                if(requestId !== routeRequestId || loadId !== routeLoadId) return;

                const routeData = data.routes.reduce((shortest, route) =>
                    route.distance < shortest.distance ? route : shortest
                );
                const leg = routeData.legs && routeData.legs[0];
                if(!leg || !leg.steps || !leg.steps.length){
                    throw new Error("Route response did not contain turn-by-turn steps");
                }

                if(routeMap){
                    routeMap.stop();
                    routeMap.remove();
                }
                routeMap = L.map("route-map-canvas", {
                    zoomSnap: 0.5
                });

                L.tileLayer(
                    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                    { attribution: "© OpenStreetMap" }
                ).addTo(routeMap);

                L.marker(destination)
                    .addTo(routeMap)
                    .bindPopup(t("Restaurant", "Restaurant"));

                routeSteps = leg.steps;
                currentRouteStepIndex = 0;

                const routeLine = L.geoJSON(routeData.geometry, {
                    style: { color: "#70dfff", weight: 8, opacity: 0.95 }
                }).addTo(routeMap);
                routeOverviewBounds = L.latLngBounds([origin, destination]);
                routeOverviewBounds.extend(routeLine.getBounds());
                routeMap.fitBounds(
                    routeOverviewBounds,
                    {
                        paddingTopLeft: [24, 120],
                        paddingBottomRight: [24, 120],
                        maxZoom: 16
                    }
                );
                routeTotalDistance = routeData.distance;
                routeTotalDuration = routeData.duration;

                routePreviewMarker = L.circleMarker(origin, {
                    radius: 8,
                    color: "#ffffff",
                    weight: 3,
                    fillColor: "#1687ff",
                    fillOpacity: 1
                }).addTo(routeMap)
                    .bindPopup(t("Din placering", "Your location"));

                const startButton = document.getElementById("route-start-button");
                const distance = document.getElementById("route-distance");
                const instruction = document.getElementById("route-instruction");
                const maneuverIcon = document.getElementById("route-maneuver-icon");
                const arrivalTime = document.getElementById("route-arrival-time");
                const status = document.getElementById("route-status");
                const arrival = new Date(Date.now() + routeData.duration * 1000);
                const arrivalClock = arrival.toLocaleTimeString(
                    currentLanguage === "da" ? "da-DK" : "en-GB",
                    { hour: "2-digit", minute: "2-digit" }
                );

                if(distance){
                    distance.textContent = routeDistanceText(routeData.distance);
                }
                if(instruction){
                    instruction.textContent = t("Ruteoversigt", "Route overview");
                }
                if(maneuverIcon){
                    maneuverIcon.textContent = "↗";
                }
                if(arrivalTime){
                    arrivalTime.textContent = t(
                        `Cirka ${routeDurationText(routeData.duration)}`,
                        `About ${routeDurationText(routeData.duration)}`
                    );
                }
                if(status){
                    status.textContent = t(
                        `${routeDistanceText(routeData.distance)} · ankomst ca. ${arrivalClock}`,
                        `${routeDistanceText(routeData.distance)} · arrival about ${arrivalClock}`
                    );
                }
                if(startButton){
                    startButton.disabled = false;
                }

                routeButton.disabled = false;
            })
            .catch(error => {
                if(requestId !== routeRequestId || loadId !== routeLoadId) return;

                console.error("Kunne ikke hente ruten:", error);
                if(status){
                    status.textContent = mode === "car"
                        ? t(
                            "Bilruten kunne ikke hentes. Prøv igen senere.",
                            "The driving route could not be loaded. Please try again later."
                        )
                        : t(
                            "Gå-ruten kunne ikke hentes. Prøv igen senere.",
                            "The walking route could not be loaded. Please try again later."
                        );
                }
                if(startButton){
                    startButton.disabled = true;
                }
                routeButton.disabled = false;
            });
    };

    routeModeChangeHandler = () => {
        if(userLat !== null && userLng !== null){
            loadRoute(userLat, userLng);
        }
    };

    if(!navigator.geolocation){
        showRouteError(t(
            "Din browser understøtter ikke placering.",
            "Your browser does not support location access."
        ));
        return;
    }

    if(userLat !== null && userLng !== null){
        loadRoute(userLat, userLng);
        return;
    }

    navigator.geolocation.getCurrentPosition(
        position => {
            userLat = position.coords.latitude;
            userLng = position.coords.longitude;
            loadRoute(userLat, userLng);
        },
        error => {
            console.error("Kunne ikke hente din placering til ruten:", error);
            showRouteError(t(
                "Din placering kunne ikke hentes. Tillad placering i browseren, og prøv igen.",
                "Your location could not be retrieved. Allow location access in your browser and try again."
            ));
        }
    );
}

function bindRestaurantPopup(marker, r){

    let closePopupTimeout;
    let popupHovered = false;

    marker.bindPopup(`
        <div class="restaurant-map-popup" style="width:242px; color:white; background:#222; padding:12px; border-radius:8px;">
            <strong style="display:block; margin-bottom:8px;">${r.restaurant}</strong>
            <div class="info-card" style="padding:0 12px 12px; margin:0;">
                ${restaurantDetailsHtml(r, true)}
            </div>
        </div>
    `, {
        maxWidth: 340,
        maxHeight: 450,
        className: 'restaurant-info-popup'
    });

    marker.on('mouseover', function(){
        clearTimeout(closePopupTimeout);
        this.openPopup();
    });

    marker.on('mouseout', function(){
        closePopupTimeout = setTimeout(() => {
            if(!popupHovered){
                this.closePopup();
            }
        }, 150);
    });

    marker.on('popupopen', event => {
        const popupElement = event.popup.getElement();

        popupElement.onmouseenter = () => {
            popupHovered = true;
            clearTimeout(closePopupTimeout);
        };

        popupElement.onmouseleave = () => {
            popupHovered = false;
            marker.closePopup();
        };
    });

    marker.on('popupclose', () => {
        popupHovered = false;
    });
}

    )}</h1>

    <div id="map"

            style="
                width:100%;
                height:700px;
                border-radius:12px;
                overflow:hidden;
            ">
        </div>
    `;

    document.getElementById('content').innerHTML = html;

    const map = L.map('map').setView(
        [userLat, userLng],
        11
    );

    L.circleMarker(
        [userLat, userLng],
        {
            radius:10,
            fillColor:"#0080ff",
            color:"#ffffff",
            weight:2,
            fillOpacity:1
        }
    )
    .addTo(map)
    .bindPopup(
        t(
            "📍 Du er her",
            "📍 You are here"
        )
    );

   L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution:'© OpenStreetMap'
    }
).addTo(map);

    restaurants.forEach(r => {

        if(!r.gps) return;

        const coords =
            r.gps.split(',');

        const lat =
            parseFloat(coords[0]);

        const lng =
            parseFloat(coords[1]);

        bindRestaurantPopup(
            L.marker([lat,lng]).addTo(map),
            r
        );

    });

}

document.addEventListener("contextmenu", event => {
    if(event.target instanceof Element && event.target.closest("img")){
        event.preventDefault();
    }
});

if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./service-worker.js")
        .catch(error => {
            console.error("Kunne ikke registrere service worker:", error);
        });
}

</script>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
